appId: ${BROWSER_APP_ID}
name: NixHost CI admin login
tags:
  - nix-on-droid
  - ci-admin
---
- launchApp
- openLink: ${NIXHOST_URL}/login
- assertVisible: "Sign in"
- tapOn: "Username"
- inputText: "qwerty123456"
- tapOn: "Password"
- inputText: "qwerty123456"
- tapOn: "Sign in"
- assertVisible: "Applications"
- assertVisible: "New application"
- takeScreenshot: "nixhost-ci-admin-applications"
